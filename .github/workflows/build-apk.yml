{"name":"Build Debug APK","on":["push","workflow_dispatch"],"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-node@v4","with":{"node-version":20}},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":17}},{"name":"Install","run":"npm install"},{"name":"Prepare web","run":"mkdir -p www assets; if [ ! -f www/index.html ]; then cp index.html www/index.html; fi; for f in icon-only icon-foreground icon-background; do if [ -f $f.png ]; then cp $f.png assets/$f.png; fi; done"},{"name":"Add Android","run":"if [ ! -d android ]; then npx cap add android; fi"},{"name":"Splash","run":"if [ -f patch-splash.py ]; then python3 patch-splash.py; fi"},{"name":"Icons","run":"if [ -f assets/icon-only.png ]; then npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0F5132' --iconBackgroundColorDark '#0F5132' || echo icons-skipped; fi"},{"name":"Sync","run":"npx cap sync android"},{"name":"Build","run":"cd android && chmod +x gradlew && ./gradlew assembleDebug"},{"name":"Upload APK","uses":"actions/upload-artifact@v4","with":{"name":"Dhikr-debug-apk","path":"android/app/build/outputs/apk/debug/app-debug.apk"}}]}}}

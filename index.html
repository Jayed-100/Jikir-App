<style>
:root{--bg:#FBF6EA;--card:#fff;--ink:#17261F;--mut:#4A5A52;--em:#0F5132;--mint:#DDF0E6;--gold:#8A6A1E;--bd:#E4DCC8;--ar:#0F5132;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A15;--card:#16251E;--ink:#EAF2ED;--mut:#A9BBB1;--em:#1F7A55;--mint:#1D3329;--gold:#E8D49A;--bd:#27382F;--ar:#9FE0BF}}
:root[data-theme="dark"]{--bg:#0E1A15;--card:#16251E;--ink:#EAF2ED;--mut:#A9BBB1;--em:#1F7A55;--mint:#1D3329;--gold:#E8D49A;--bd:#27382F;--ar:#9FE0BF}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans Bengali',system-ui,sans-serif;color-scheme:light dark}
#app{max-width:520px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.ar{font-family:'Amiri',serif;direction:rtl;line-height:1.7;color:var(--ar);text-align:center}
.c{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px}
button{font-family:inherit;font-size:16px;cursor:pointer;color:var(--ink)}
.b{min-height:52px;border-radius:26px;background:var(--em);color:#fff;border:0;font-weight:600;width:100%}
.b2{background:var(--mint);color:var(--ar)}
.chip{min-height:44px;padding:0 16px;border-radius:22px;background:var(--card);border:1px solid var(--bd)}
.chip.on{background:var(--em);color:#fff;border-color:var(--em)}
.m{color:var(--mut);font-size:14px}.g{color:var(--gold);font-weight:600;font-size:13px}
h1{font-size:24px;margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
input[type=text],input[type=number],input[type=search]{width:100%;box-sizing:border-box;min-height:48px;border:1px solid var(--bd);border-radius:14px;padding:0 14px;font-size:16px;background:var(--card);color:var(--ink);font-family:inherit}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-height:64px;background:none;border:0;font-size:13px;color:var(--mut)}
nav button.on{color:var(--ar);font-weight:700}
.tap{width:230px;height:230px;border-radius:50%;background:var(--em);color:#fff;border:0;box-shadow:0 10px 24px rgba(0,0,0,.25);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.bar{display:flex;align-items:flex-end;gap:8px;height:120px}.bar div{flex:1;text-align:center;font-size:12px;color:var(--mut)}.bar i{display:block;background:var(--em);border-radius:6px 6px 0 0}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden></nav>

var S={lang:"",theme:"system",ts:1,cs:1,vb:1,sz:1,cur:"d0",c:{},t:{},dn:{},hist:[],fav:[],cu:[],paused:0};
try{var x=JSON.parse(localStorage.getItem("sakina")||"null");if(x)for(var k in x)S[k]=x[k]}catch(e){}

var tp={};S.hist.forEach(function(h){tp[h.n]=(tp[h.n]||0)+h.c});var tops=Object.keys(tp).sort(function(a,b){return tp[b]-tp[a]}).slice(0,3);
var h=S.hist.slice().reverse(),g="",ld="";h.forEach(function(e){var dd=day(e.ts);if(dd!=ld){g+='<div class="g" style="margin:14px 0 6px">'+dd+'</div>';ld=dd}var tm=new Date(e.ts);g+='<div class="c row" style="padding:12px"><div><b>'+esc(e.n)+'</b><div class="m">'+("0"+tm.getHours()).slice(-2)+":"+("0"+tm.getMinutes()).slice(-2)+'</div></div><div style="text-align:right"><b>'+e.c+' / '+e.t+'</b><div class="g">'+(e.ok?L("ok"):L("inc"))+'</div></div></div>'});
return '<h1>'+L("hist")+'</h1><div class="row" style="margin:12px 0"><div class="c" style="flex:1;text-align:center;margin:0"><b style="font-size:26px">'+todayN()+'</b><div class="m">'+L("today")+'</div></div><div class="c" style="flex:1;text-align:center;margin:0"><b style="font-size:26px">'+sum(function(){return 1})+'</b><div class="m">'+L("life")+'</div></div><div class="c" style="flex:1;text-align:center;margin:0"><b style="font-size:26px">'+S.hist.filter(function(e){return e.ok}).length+'</b><div class="m">'+L("sess")+'</div></div></div><div class="c"><div class="g">'+L("week")+'</div><div class="bar">'+vals.map(function(v,i){return '<div><i style="height:'+Math.max(4,v*90/mx)+'px"></i>'+days[i].slice(8)+'</div>'}).join("")+'</div></div>'+(tops.length?'<div class="c"><div class="g">'+L("top")+'</div>'+tops.map(function(n){return '<div class="row" style="padding:6px 0"><span>'+esc(n)+'</span><b>'+tp[n]+'</b></div>'}).join("")+'</div>':'')+(h.length?g:'<p class="m">'+L("none")+'</p>')}
function sw(k,key){return '<label class="row" style="margin:0;min-height:52px;font-size:16px;color:var(--ink)"><span>'+L(k)+'</span><input type="checkbox" '+(S[key]?'checked':'')+' onchange="S.'+key+'=this.checked?1:0;save()" style="width:26px;height:26px;accent-color:var(--em)"></label>'}
return '<h1>'+L("set")+'</h1><div class="c" style="margin-top:12px"><div class="g">'+L("lang")+'</div><div style="display:flex;gap:8px;margin-top:8px"><button class="chip'+(S.lang=="bn"?' on':'')+'" onclick="pickLang(\'bn\')">বাংলা</button><button class="chip'+(S.lang=="en"?' on':'')+'" onclick="pickLang(\'en\')">English</button></div></div><div class="c"><div class="g">'+L("theme")+'</div><div style="display:flex;gap:8px;margin-top:8px">'+[["light","light"],["dark","dark"],["sys","system"]].map(function(a){return '<button class="chip'+(S.theme==a[1]?' on':'')+'" onclick="setTh(\''+a[1]+'\')">'+L(a[0])+'</button>'}).join("")+'</div></div><div class="c">'+sw("tsnd","ts")+sw("csnd","cs")+sw("vib","vb")+'<label for="sz">'+L("size")+'</label><input id="sz" type="range" min="1" max="1.5" step=".1" value="'+S.sz+'" onchange="S.sz=parseFloat(this.value);save()" style="width:100%;accent-color:var(--em)"></div><p class="m">'+L("tip")+'</p>'}
function setTh(t){S.theme=t;save();applyTh();render()}
function applyTh(){var r=document.documentElement;if(S.theme=="system")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme)}
function render(){var a=document.getElementById("app");a.innerHTML=view();var n=document.getElementById("nav");n.hidden=!S.lang||showForm;n.innerHTML=[["home","home"],["count","count"],["hist","hist"],["set","set"]].map(function(x){return '<button class="'+(tab==x[0]?'on':'')+'" onclick="tab=\''+x[0]+'\';render()">'+L(x[1])+'</button>'}).join("");renderList()}
applyTh();render();
</script>
</body>
</html>

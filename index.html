<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5132">
<title>সাকিনা – ডিজিটাল তাসবিহ</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6EA;--card:#fff;--ink:#17261F;--mut:#4A5A52;--em:#0F5132;--mint:#DDF0E6;--gold:#8A6A1E;--bd:#E4DCC8;--ar:#0F5132;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A15;--card:#16251E;--ink:#EAF2ED;--mut:#A9BBB1;--em:#1F7A55;--mint:#1D3329;--gold:#E8D49A;--bd:#27382F;--ar:#9FE0BF}}
:root[data-theme="dark"]{--bg:#0E1A15;--card:#16251E;--ink:#EAF2ED;--mut:#A9BBB1;--em:#1F7A55;--mint:#1D3329;--gold:#E8D49A;--bd:#27382F;--ar:#9FE0BF}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans Bengali',system-ui,sans-serif;color-scheme:light dark}
#app{max-width:520px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.ar{font-family:'Amiri',serif;direction:rtl;line-height:1.7;color:var(--ar);text-align:center}
.c{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px}
button{font-family:inherit;font-size:16px;cursor:pointer;color:var(--ink)}
.b{min-height:52px;border-radius:26px;background:var(--em);color:#fff;border:0;font-weight:600;width:100%}
.b2{background:var(--mint);color:var(--ar)}
.chip{min-height:44px;padding:0 16px;border-radius:22px;background:var(--card);border:1px solid var(--bd)}
.chip.on{background:var(--em);color:#fff;border-color:var(--em)}
.m{color:var(--mut);font-size:14px}.g{color:var(--gold);font-weight:600;font-size:13px}
h1{font-size:24px;margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
input[type=text],input[type=number],input[type=search]{width:100%;box-sizing:border-box;min-height:48px;border:1px solid var(--bd);border-radius:14px;padding:0 14px;font-size:16px;background:var(--card);color:var(--ink);font-family:inherit}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-height:68px;background:none;border:0;font-size:13px;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button.on{color:var(--ar);font-weight:700}
.tap{width:230px;height:230px;border-radius:50%;background:var(--em);color:#fff;border:0;box-shadow:0 10px 24px rgba(0,0,0,.25);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.bar{display:flex;align-items:flex-end;gap:8px;height:120px}.bar div{flex:1;text-align:center;font-size:12px;color:var(--mut)}.bar i{display:block;background:var(--em);border-radius:6px 6px 0 0}
#sp{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#1F855A 0%,#0F5132 55%,#07331F 100%);transition:opacity .6s ease}
#sp img{width:170px;opacity:0;transform:scale(.6);animation:pop 1s cubic-bezier(.2,.8,.2,1) .1s forwards,beat 2.2s ease-in-out 1.1s infinite}
.spn{color:#E8D49A;font-size:28px;font-weight:700;margin-top:20px;letter-spacing:1px;opacity:0;animation:fin .8s ease .7s forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
@keyframes beat{50%{transform:scale(1.05)}}
@keyframes fin{to{opacity:1}}
</style>
</head>
